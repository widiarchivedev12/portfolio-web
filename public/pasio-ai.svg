<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="#6366f1" opacity="0.08"/>
  <circle cx="150" cy="370" r="90" fill="#a78bfa" opacity="0.08"/>
  <!-- AI node lines -->
  <line x1="400" y1="180" x2="300" y2="260" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="180" x2="500" y2="260" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="180" x2="400" y2="270" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <circle cx="300" cy="260" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="500" cy="260" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="400" cy="270" r="5" fill="#a78bfa" opacity="0.7"/>
  <!-- Center icon circle -->
  <circle cx="400" cy="180" r="32" fill="url(#accent)" opacity="0.9"/>
  <!-- Brain/AI icon simplified -->
  <text x="400" y="188" font-family="monospace" font-size="22" fill="white" text-anchor="middle">AI</text>
  <!-- Title -->
  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">Pasio AI</text>
  <!-- Subtitle -->
  <text x="400" y="362" font-family="system-ui, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">Adaptive AI Assessment · React Native · Gemini</text>
</svg>
